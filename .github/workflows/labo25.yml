name: "Labo (lot 3b : politiciens, robots.txt et échantillons)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance13.py", ".github/workflows/labo25.yml"]

permissions:
  contents: write

jobs:
  lot3b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lot3b && python labo/reconnaissance13.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lot3b
          git commit -m "Labo : lot 3b (politiciens) du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot K : extraits des fichiers XBRL de la SEC pour les tests du robot)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_lotK.py", ".github/workflows/labo63.yml"]

permissions:
  contents: write

jobs:
  extraits:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-lotK && python labo/fixtures_lotK.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-lotK
          git commit -m "Labo : lot K, extraits XBRL pour les tests du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

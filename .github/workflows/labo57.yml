name: "Labo (lot H : 3 jours de 8-K relus en entier, ni oubli ni de trop)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-lotH-jours.txt", ".github/workflows/labo57.yml"]

permissions:
  contents: write

jobs:
  jours:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rm -rf labo/resultats-lotH-jours && mkdir -p labo/resultats-lotH-jours
      - name: Les jours lus par le robot, relus en entier
        run: |
          s=0
          for j in $(python -c "import json;print(' '.join(json.load(open('principal/data/sec/jours_lus.json'))['sec_rachats']))"); do
            python labo/verif_lotH.py principal/data labo/resultats-lotH-jours/$j.txt --jour=$j || s=1
          done
          exit $s
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lotH-jours
          git commit -m "Labo : lot H, jours de 8-K relus en entier, $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

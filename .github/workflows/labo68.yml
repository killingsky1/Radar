name: "Labo (lot L : extraits réels des initiés 2023-2025, prix, actions, seuils du NYSE)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_lotL.py", ".github/workflows/labo68.yml"]

permissions:
  contents: write

jobs:
  extraits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-lotL && python labo/fixtures_lotL.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-lotL
          git commit -m "Labo : extraits du lot L du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

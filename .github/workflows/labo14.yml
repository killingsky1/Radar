name: "Labo (lettres FDA)"

on:
  push:
    branches: [labo]
    paths: ["labo/lettres_fda.py", ".github/workflows/labo14.yml"]

permissions:
  contents: write

jobs:
  lettres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pdfplumber==0.11.4
      - run: rm -rf labo/resultats-lettres && python labo/lettres_fda.py
      - name: Sauvegarder
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lettres
          git commit -m "Labo : lettres FDA du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

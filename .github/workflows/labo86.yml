name: "Labo (étape 2 : prix des formulaires 4 quand la SEC n'a pas de prix)"

# Lancé quand on modifie labo/tournoi/declencheur-prix-form4.txt. Lecture seulement du cache du labo (aucun site lu) :
# n'entre pas dans la file du robot (groupe radar).
on:
  push:
    branches: [labo]
    paths: ["labo/tournoi/declencheur-prix-form4.txt"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labo86
  cancel-in-progress: false

jobs:
  mesurer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: "Le code du robot (main, 0.27.1)"
        uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r principal/robot/requirements.txt
      - name: Le jeu de recherche (cache de l'étape 0)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: tournoi-aucun
          restore-keys: tournoi-
      - name: Prix des formulaires 4 (découverte et coffre-fort)
        run: |
          test -f cache/decouverte/evenements.jsonl.gz && test -f cache/ftd/202301a.zip
          git -C principal log --oneline -1
          python labo/tournoi/mesures/prix_form4.py --donnees cache/decouverte --ftd cache/ftd --robot principal/robot --sortie labo/tournoi/mesures/prix_form4_decouverte.json
          python labo/tournoi/mesures/prix_form4.py --donnees cache/coffre --ftd cache/ftd --robot principal/robot --sortie labo/tournoi/mesures/prix_form4_coffre.json
          python labo/tournoi/mesures/prix_form4.py --actions-ordinaires --donnees cache/decouverte --ftd cache/ftd --robot principal/robot --sortie labo/tournoi/mesures/prix_form4_ordinaires_decouverte.json
          python labo/tournoi/mesures/prix_form4.py --actions-ordinaires --donnees cache/coffre --ftd cache/ftd --robot principal/robot --sortie labo/tournoi/mesures/prix_form4_ordinaires_coffre.json
      - name: Sauvegarder les mesures
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/tournoi/mesures
          git commit -m "Labo : mesure 3, prix des formulaires 4 ($(date -u +'%Y-%m-%d %H:%M') UTC)" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

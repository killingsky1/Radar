name: "Labo (lot 3b, D et E : essai réel du lobbying et filtres de l'OGE)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance15.py", ".github/workflows/labo28.yml"]

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lobbying-essai && python labo/reconnaissance15.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lobbying-essai
          git commit -m "Labo : essai lobbying et OGE du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

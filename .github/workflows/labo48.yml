name: "Labo (participations : vraies pages de 3 dépôts pour les tests)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_participations.py", ".github/workflows/labo48.yml"]

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-participations && python labo/fixtures_participations.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-participations
          git commit -m "Labo : pages de 3 dépôts (participations) du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

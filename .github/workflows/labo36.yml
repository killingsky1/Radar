name: "Labo (lot 3c, fichiers des tests, livraison 1 : Canada)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_canada3c.py", ".github/workflows/labo36.yml"]

permissions:
  contents: write

jobs:
  fixtures3c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-canada3c && python labo/fixtures_canada3c.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-canada3c
          git commit -m "Labo : Canada fichiers des tests, livraison 1 du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

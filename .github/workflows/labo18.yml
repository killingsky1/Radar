name: "Labo (pages OFAC)"

on:
  push:
    branches: [labo]
    paths: ["labo/ofac_page.py", ".github/workflows/labo18.yml"]

permissions:
  contents: write

jobs:
  ofac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-ofac && python labo/ofac_page.py
      - name: Sauvegarder
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-ofac
          git commit -m "Labo : pages OFAC du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

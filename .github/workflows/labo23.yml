name: "Labo (type des émetteurs selon la SEC)"

on:
  push:
    branches: [labo]
    paths: ["labo/emetteurs.py", ".github/workflows/labo23.yml"]

permissions:
  contents: write

jobs:
  emetteurs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-emetteurs && python labo/emetteurs.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-emetteurs
          git commit -m "Labo : type des émetteurs du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

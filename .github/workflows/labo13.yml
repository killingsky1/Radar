name: "Labo (Norges Bank 13F)"

on:
  push:
    branches: [labo]
    paths: ["labo/norges.py", ".github/workflows/labo13.yml"]

permissions:
  contents: write

jobs:
  norges:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-norges && python labo/norges.py
      - name: Sauvegarder
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-norges
          git commit -m "Labo : Norges du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

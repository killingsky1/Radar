name: "Labo (lot 3d, 1er passage : Trésor, USAspending, tarifs, NBIM, participations, communiqués, SEC)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance20.py", ".github/workflows/labo43.yml"]

permissions:
  contents: write

jobs:
  lot3d:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lot3d && python labo/reconnaissance20.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lot3d
          git commit -m "Labo : lot 3d, 1er passage du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot 3d, livraison 2 : USAspending, participations du gouvernement : données et mesures)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance22.py", ".github/workflows/labo46.yml"]

permissions:
  contents: write

jobs:
  lot3d_l2:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-lot3d2 && python labo/reconnaissance22.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-lot3d2
          git commit -m "Labo : lot 3d, livraison 2, données et mesures du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

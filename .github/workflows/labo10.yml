name: "Labo (robots.txt de chaque site)"

on:
  push:
    branches: [labo]
    paths: ["labo/robots.py", ".github/workflows/labo10.yml"]

permissions:
  contents: write

jobs:
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-robots && python labo/robots.py
      - name: Sauvegarder
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-robots
          git commit -m "Labo : robots.txt du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

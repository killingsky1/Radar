name: "Labo (lot 3c, 4e passage : contrats : Canada)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance19.py", ".github/workflows/labo35.yml"]

permissions:
  contents: write

jobs:
  canada4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lot3c4 && python labo/reconnaissance19.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lot3c4
          git commit -m "Labo : Canada 4e passage : contrats du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot 3b, D et E : lobbying et rapports OGE)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance14.py", ".github/workflows/labo27.yml"]

permissions:
  contents: write

jobs:
  lobbying-oge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lobbying-oge && python labo/reconnaissance14.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lobbying-oge
          git commit -m "Labo : lobbying et OGE du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

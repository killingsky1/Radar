name: "Labo (lot 3d, livraison 1 : vraies données des tests : Trésor, douane)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_lot3d.py", ".github/workflows/labo45.yml"]

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-lot3d && python labo/fixtures_lot3d.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-lot3d
          git commit -m "Labo : lot 3d, données des tests du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

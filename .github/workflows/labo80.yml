name: "Labo (tournoi, étape 0 : le jeu de recherche, 2016 à juin 2026)"

# Lancé seulement quand on modifie labo/tournoi/declencheur-donnees.txt (ou à la main), juste après un passage du robot :
# un autre envoi dans la branche ne le lance jamais, car il entrerait dans la file du robot (groupe radar) et pourrait y
# remplacer un passage en attente. (GitHub ne permet de le lancer « à la main » qu'une fois qu'il a tourné une 1re fois.)
on:
  push:
    branches: [labo]
    paths: ["labo/tournoi/declencheur-donnees.txt"]
  workflow_dispatch:

permissions:
  contents: write

# Même groupe que le robot (radar.yml) : jamais les deux en même temps, donc la SEC voit un seul client à la fois
# (5 requêtes par seconde au plus). Le coffre-fort ne quitte jamais le cache (aucune copie téléchargeable).
concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  donnees:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -r principal/robot/requirements.txt
      - name: Reprendre les fichiers déjà lus (cache)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: tournoi-${{ github.run_id }}
          restore-keys: tournoi-
      - name: Jeu de recherche (découverte et coffre-fort → cache ; résumé → branche labo)
        run: python labo/tournoi/donnees.py
      - name: Garder les fichiers lus et le coffre-fort (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: tournoi-${{ github.run_id }}
      - name: Copie de la découverte (30 jours), au cas où le cache serait effacé
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: decouverte
          path: cache/decouverte
          retention-days: 30
      - name: Sauvegarder le résumé et le journal de la découverte (les données restent dans le cache)
        if: always()
        run: |
          test ! -e labo/tournoi/donnees/coffre
          ls -la labo/tournoi/donnees
          # GitHub refuse les fichiers de plus de 100 Mo : on s'arrête avant avec un message clair
          if find labo/tournoi/donnees -type f -size +95M | grep -q .; then echo "FICHIER TROP GROS (plus de 95 Mo)"; exit 1; fi
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/tournoi/donnees
          git commit -m "Labo : tournoi, jeu de recherche de la découverte ($(date -u +'%Y-%m-%d %H:%M') UTC)" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

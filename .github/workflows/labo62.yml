name: "Labo (lot K : recherche avant le plan de match, santé financière F-score et données XBRL de la SEC)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance26.py", ".github/workflows/labo62.yml"]

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests && sudo apt-get install -y poppler-utils > /dev/null
      - run: rm -rf labo/resultats-fscore && python labo/reconnaissance26.py principal/data
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-fscore
          git commit -m "Labo : lot K, recherche santé financière du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

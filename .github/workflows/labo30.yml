name: "Labo (lobbying et OGE contre-vérifiés aux sources officielles)"

on:
  push:
    branches: [labo]
    paths: ["labo/verif_lobbying_oge.py", ".github/workflows/labo30.yml"]

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: mkdir -p labo/resultats-lobbying-oge-verif && python labo/verif_lobbying_oge.py principal/data labo/resultats-lobbying-oge-verif/verif.txt
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lobbying-oge-verif
          git commit -m "Labo : lobbying et OGE vérifiés du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

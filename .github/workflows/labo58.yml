name: "Labo (lot H : mesure TÉMOIN, 5 jours jamais regardés, 3 au 7 août 2026)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-lotH-temoin.txt", ".github/workflows/labo58.yml"]

permissions:
  contents: write

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lotH-temoin && python labo/mesure_lotH.py 2026-08-07 5 labo/resultats-lotH-temoin
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lotH-temoin
          git commit -m "Labo : lot H, mesure témoin du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

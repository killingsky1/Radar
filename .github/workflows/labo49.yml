name: "Labo (recherche avant le plan de match : fins de blocage, prix, rachats, FINRA)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance23.py", ".github/workflows/labo49.yml"]

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-plan-fgh && python labo/reconnaissance23.py principal/data
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-plan-fgh
          git commit -m "Labo : recherche avant le plan de match du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

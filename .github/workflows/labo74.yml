name: "Labo (recherche 30 : formats des fichiers pour le rejeu d'un an)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance30.py", ".github/workflows/labo74.yml"]

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -r principal/robot/requirements.txt
      - run: rm -rf labo/recon30 && python labo/reconnaissance30.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/recon30
          git commit -m "Labo : recherche 30 du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

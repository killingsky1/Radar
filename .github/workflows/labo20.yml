name: "Labo (score : recalcul indépendant et site en ligne)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-score.txt", "labo/recalcul_score.py", "labo/site_score.cjs", "labo/verif_congres.py",
            ".github/workflows/labo20.yml"]

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -rf labo/resultats-score && mkdir -p labo/resultats-score
      - name: Recalcul indépendant
        run: python labo/recalcul_score.py principal/data > labo/resultats-score/recalcul.txt 2>&1; s=$?; cat labo/resultats-score/recalcul.txt; exit $s
      - name: Congrès contre-vérifié aux pages officielles
        if: always()
        run: python labo/verif_congres.py principal/data labo/resultats-score/congres.txt
      - run: npm i --no-save playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Site en ligne
        if: always()
        run: |
          (cd principal && git log -1 --format='Données de main : %h %s' -- data) > labo/resultats-score/main.txt
          node labo/site_score.cjs principal/data/app/aujourdhui.json labo/resultats-score principal/data/app/elus.json
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-score
          git commit -m "Labo : score vérifié du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

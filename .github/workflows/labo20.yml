name: "Labo (score : recalcul indépendant et site en ligne)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-score.txt", "labo/recalcul_score.py", "labo/site_score.cjs", "labo/verif_congres.py",
            "labo/verif_canada3c.py", "labo/verif_canada3c2.py", "labo/verif_lot3d.py",
            "labo/verif_lot3d2.py", "labo/verif_lotA.py",
            "labo/verif_argent.py", "labo/verif_lotF.py", "labo/verif_lotG.py", "labo/verif_lotH.py", "labo/verif_lotK.py", "labo/verif_lotL.py", "labo/acces.py",
            "labo/detecteur_rachats.py", ".github/workflows/labo20.yml"]

permissions:
  contents: write

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -rf labo/resultats-score && mkdir -p labo/resultats-score
      - name: Recalcul indépendant
        run: python labo/recalcul_score.py principal/data > labo/resultats-score/recalcul.txt 2>&1; s=$?; cat labo/resultats-score/recalcul.txt; exit $s
      - name: Congrès contre-vérifié aux pages officielles
        if: always()
        run: python labo/verif_congres.py principal/data labo/resultats-score/congres.txt
      - name: Canada (lot 3c) contre-vérifié aux sources officielles
        if: always()
        run: python labo/verif_canada3c.py principal/data labo/resultats-score/canada3c.txt
      - name: Canada (lot 3c, livraison 2) contre-vérifié aux sources officielles (PDF lu par pdftotext)
        if: always()
        run: |
          which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python labo/verif_canada3c2.py principal/data labo/resultats-score/canada3c2.txt
      - name: États-Unis (lot 3d) contre-vérifié aux documents officiels (XML du Trésor, pages de la douane)
        if: always()
        run: python labo/verif_lot3d.py principal/data labo/resultats-score/lot3d.txt
      - name: États-Unis (lot 3d, livraison 2) contre-vérifié (API d'USAspending, dépôts de la SEC)
        if: always()
        run: python labo/verif_lot3d2.py principal/data labo/resultats-score/lot3d2.txt
      - name: Lot A contre-vérifié (doublons de formulaires 4, sites qui refusent le robot, titres)
        if: always()
        run: python labo/verif_lotA.py principal/data labo/resultats-score/lotA.txt
      - name: Section Argent contre-vérifiée (chaque formulaire 4 et 144 relu à la SEC)
        if: always()
        run: python labo/verif_argent.py principal/data labo/resultats-score/argent.txt
      - name: Fins de blocage (lot F) contre-vérifiées (chaque prospectus 424B4 relu à la SEC)
        if: always()
        run: python labo/verif_lotF.py principal/data labo/resultats-score/lotF.txt
      - name: Résultats de Radar (lot G) refaits à partir des fichiers officiels de la SEC
        if: always()
        run: python labo/verif_lotG.py principal/data labo/resultats-score/lotG.txt
      - name: Rachats d'actions (lot H) contre-vérifiés (chaque 8-K relu à la SEC, fichier XBRL de la SEC relu)
        if: always()
        run: python labo/verif_lotH.py principal/data labo/resultats-score/lotH.txt
      - name: Santé financière (lot K) refaite à partir du dossier de chaque compagnie à la SEC (companyfacts)
        if: always()
        run: python labo/verif_lotK.py principal/data labo/resultats-score/lotK.txt
      - name: Lot L contre-vérifié (initiés routiniers refaits aux jeux de données de la SEC, tailles refaites aux sources)
        if: always()
        run: python labo/verif_lotL.py principal/data labo/resultats-score/lotL.txt
      - name: Navigateur (installé même si une vérification a échoué)
        if: always()
        run: npm i --no-save playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Site en ligne
        if: always()
        run: |
          (cd principal && git log -1 --format='Données de main : %h %s' -- data) > labo/resultats-score/main.txt
          node labo/site_score.cjs principal/data/app/aujourdhui.json labo/resultats-score principal/data/app/elus.json principal/data/app/lobbying.json
      - name: Photos de la 0.27.0 (écartées, fiche, méthode, Résultats), vérifiées aux fichiers du robot
        if: always()
        run: node labo/photos_027.cjs https://killingsky1.github.io/Radar/ principal/data/app labo/resultats-score/photos-027 0.27.0
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-score
          git commit -m "Labo : score vérifié du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

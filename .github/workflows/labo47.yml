name: "Labo (participations du gouvernement : mesure du vrai code du robot, branche d'essai)"

on:
  push:
    branches: [labo]
    paths: ["labo/mesure_participations.py", ".github/workflows/labo47.yml"]

permissions:
  contents: write

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: essai-lot3d2
          path: code
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -r code/robot/requirements.txt
      - run: rm -rf labo/resultats-participations && python labo/mesure_participations.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-participations
          git commit -m "Labo : participations mesurées du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

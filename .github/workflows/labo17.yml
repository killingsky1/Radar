name: "Labo (reconnaissance 3 du lot 3a)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance11.py", ".github/workflows/labo17.yml"]

permissions:
  contents: write

jobs:
  lot3a3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lot3a3 && python labo/reconnaissance11.py
      - name: Sauvegarder
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lot3a3
          git commit -m "Labo : reconnaissance 3a3 du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot 3d, 2e passage : USAspending, conditions, participations du gouvernement, SEC)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance21.py", ".github/workflows/labo44.yml"]

permissions:
  contents: write

jobs:
  lot3d2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lot3d2 && python labo/reconnaissance21.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lot3d2
          git commit -m "Labo : lot 3d, 2e passage du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot 3c, ajouts aux fichiers des tests et licences : Canada)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_canada3c_ajouts.py", ".github/workflows/labo37.yml"]

permissions:
  contents: write

jobs:
  ajouts3c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python labo/fixtures_canada3c_ajouts.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-canada3c labo/resultats-licences
          git commit -m "Labo : Canada ajouts aux fichiers des tests et licences du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot H : 3e mesure TÉMOIN, règle v3 et nouveauté, 4 jours jamais regardés, 28 avril au 1er mai 2026)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-lotH-temoin3.txt", ".github/workflows/labo61.yml"]

permissions:
  contents: write

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lotH-temoin3 && python labo/mesure_lotH.py 2026-05-01 4 labo/resultats-lotH-temoin3
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lotH-temoin3
          git commit -m "Labo : lot H, 3e mesure témoin du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (lot H : fiches officielles et 8-K précédents pour la vérification de nouveauté)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_lotH2.py", ".github/workflows/labo60.yml"]

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-lotH2 && python labo/fixtures_lotH2.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-lotH2
          git commit -m "Labo : lot H, fiches et 8-K précédents du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

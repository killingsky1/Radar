name: "Labo (rejeu d'un an de Radar : 10 000 $ de juillet 2025 à juin 2026)"

on:
  push:
    branches: [labo]
    paths: ["labo/verif_rejeu.py"]

permissions:
  contents: write

jobs:
  rejeu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests -r principal/robot/requirements.txt
      - name: Reprendre les fichiers déjà lus (cache)
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: rejeu-${{ github.run_id }}
          restore-keys: rejeu-
      - name: Rejeu
        run: python labo/rejeu_radar.py
      - name: Vérification indépendante
        run: python labo/verif_rejeu.py
      - name: Garder les fichiers lus (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cache
          key: rejeu-${{ github.run_id }}
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/rejeu
          git commit -m "Labo : rejeu d'un an du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

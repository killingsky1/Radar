name: "Labo (contrats fédéraux : relecture complète indépendante)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-contrats.txt", "labo/verif_contrats.py", ".github/workflows/labo42.yml"]

permissions:
  contents: write

jobs:
  contrats:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rm -rf labo/resultats-contrats && mkdir -p labo/resultats-contrats
      - name: Contrats fédéraux relus en entier (20 s entre deux requêtes, robots.txt)
        run: |
          (cd principal && git log -1 --format='Données de main : %h %s' -- data) > labo/resultats-contrats/main.txt
          python labo/verif_contrats.py principal/data labo/resultats-contrats/contrats.txt
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-contrats
          git commit -m "Labo : contrats vérifiés du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

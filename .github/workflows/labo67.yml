name: "Labo (recherche 28 : chiffres par taille, seuils du NYSE, valeur en bourse)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance28.py", ".github/workflows/labo67.yml"]

permissions:
  contents: write

jobs:
  recherche:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests && (which pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils))
      - run: rm -rf labo/recon28 && python labo/reconnaissance28.py principal/data
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/recon28
          git commit -m "Labo : recherche 28 du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (essai réel 13F du 14 août)"

on:
  push:
    branches: [labo]
    paths: ["labo/essai13f.py", ".github/workflows/labo12.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  essai13f:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r robot/requirements.txt pdfplumber==0.11.4
      - run: rm -rf labo/essai13f && python labo/essai13f.py
      - name: Sauvegarder
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/essai13f
          git commit -m "Labo : essai réel 13F du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

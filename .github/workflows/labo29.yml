name: "Labo (fichiers de test : lobbying et OGE)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_lobbying_oge.py", ".github/workflows/labo29.yml"]

permissions:
  contents: write

jobs:
  essai:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-lobbying-oge && python labo/fixtures_lobbying_oge.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-lobbying-oge
          git commit -m "Labo : fichiers de test lobbying et OGE du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (achats lors d'une émission)"

on:
  push:
    branches: [labo]
    paths: ["labo/reconnaissance12.py", ".github/workflows/labo21.yml"]

permissions:
  contents: write

jobs:
  emissions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-emissions && python labo/reconnaissance12.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-emissions
          git commit -m "Labo : achats lors d'une émission du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

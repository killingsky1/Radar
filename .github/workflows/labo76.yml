name: "Labo (taux USD → CAD de la Banque du Canada)"

on:
  push:
    branches: [labo]
    paths: ["labo/taux_change.py", ".github/workflows/labo76.yml"]

permissions:
  contents: write

jobs:
  taux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/taux && python labo/taux_change.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/taux
          git commit -m "Labo : taux USD → CAD du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

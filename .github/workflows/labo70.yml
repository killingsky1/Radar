name: "Labo (lot L : sonde des actions en circulation, companyfacts et frames)"

on:
  push:
    branches: [labo]
    paths: ["labo/sonde_lotL.py", ".github/workflows/labo70.yml"]

permissions:
  contents: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: rm -rf labo/sonde-lotL && python labo/sonde_lotL.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/sonde-lotL
          git commit -m "Labo : sonde du lot L du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

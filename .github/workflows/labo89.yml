name: "Labo (0.27.3 : photos du vrai site, version et note honnête (Aide, Résultats))"

# Lancé quand on modifie labo/photos_0273.cjs ou ce fichier. Lit seulement le vrai site (killingsky1.github.io) : n'entre
# pas dans la file du robot.
on:
  push:
    branches: [labo]
    paths: ["labo/photos_0273.cjs", ".github/workflows/labo89.yml"]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - run: rm -rf labo/photos-0273 && mkdir -p labo/photos-0273 && git -C principal log --oneline -1 && node labo/photos_0273.cjs labo/photos-0273
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/photos-0273
          git commit -m "Labo : photos 0.27.3 du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

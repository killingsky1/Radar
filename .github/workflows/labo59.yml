name: "Labo (lot H : 2e mesure TÉMOIN, règle v2, 4 jours jamais regardés, 28 au 31 juillet 2026)"

on:
  push:
    branches: [labo]
    paths: ["labo/declencheur-lotH-temoin2.txt", ".github/workflows/labo59.yml"]

permissions:
  contents: write

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lotH-temoin2 && python labo/mesure_lotH.py 2026-07-31 4 labo/resultats-lotH-temoin2
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lotH-temoin2
          git commit -m "Labo : lot H, 2e mesure témoin du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (documents de test du Congrès)"

on:
  push:
    branches: [labo]
    paths: ["labo/fixtures_congres.py", ".github/workflows/labo26.yml"]

permissions:
  contents: write

jobs:
  congres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/fixtures-congres && python labo/fixtures_congres.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/fixtures-congres
          git commit -m "Labo : documents du Congrès du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

name: "Labo (0.27.2 : photos du vrai site, version et prix du formulaire 4)"

# Lancé quand on modifie labo/photos_0272.cjs ou ce fichier. Lit seulement le vrai site (killingsky1.github.io) et le
# fichier du score de main : n'entre pas dans la file du robot.
on:
  push:
    branches: [labo]
    paths: ["labo/photos_0272.cjs", ".github/workflows/labo88.yml"]

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.1
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Début du passage du robot 0.27.2 (Radar n° 113, lancé à la main le 9 octobre 2026) : le fichier du score doit
      # être plus récent
      - run: rm -rf labo/photos-0272 && mkdir -p labo/photos-0272 && git -C principal log --oneline -1 && node labo/photos_0272.cjs principal/data/app/aujourdhui.json labo/photos-0272 "2026-10-09T02:29:22+00:00"
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/photos-0272
          git commit -m "Labo : photos 0.27.2 du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

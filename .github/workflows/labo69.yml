name: "Labo (lot L : simulation, code de travail sur une copie des vraies données)"

on:
  push:
    branches: [labo]
    paths: ["labo/simulation_lotL.py", ".github/workflows/labo69.yml"]

permissions:
  contents: write

jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: travail
          path: code
      - uses: actions/checkout@v4
        with:
          ref: main
          path: principal
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r code/robot/requirements.txt
      - run: rm -rf labo/simulation-lotL && python labo/simulation_lotL.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/simulation-lotL
          git commit -m "Labo : simulation du lot L du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo

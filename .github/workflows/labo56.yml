name: "Labo (lot H : mesure du détecteur strict des rachats sur 10 jours de 8-K)"

on:
  push:
    branches: [labo]
    paths: ["labo/mesure_lotH.py", "labo/detecteur_rachats.py", ".github/workflows/labo56.yml"]

permissions:
  contents: write

jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: rm -rf labo/resultats-lotH && python labo/mesure_lotH.py
      - name: Sauvegarder
        if: always()
        run: |
          git config user.name "radar-robot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labo/resultats-lotH
          git commit -m "Labo : lot H, mesure du détecteur des rachats du $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase origin labo
          git push origin HEAD:labo
